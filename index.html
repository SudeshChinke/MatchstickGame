<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchstick Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
        }
        .matchstick {
            position: relative;
            width: 8px;
            height: 60px;
            background: linear-gradient(180deg, #f9c96a 0%, #f7a01d 45%, #d77b10 100%);
            border-radius: 4px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease-in-out, opacity 0.2s ease-in-out;
            cursor: pointer;
            animation: burn 1.8s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }
        .matchstick::before,
        .matchstick::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
        .matchstick::before {
            top: -14px;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #fff7d1 0%, #ffd166 30%, #ff8a3d 62%, rgba(255, 138, 61, 0) 75%);
            border-radius: 50%;
            box-shadow: 0 0 18px rgba(255, 176, 66, 0.9), 0 0 30px rgba(255, 128, 64, 0.5);
            animation: flame 0.85s ease-in-out infinite alternate;
        }
        .matchstick::after {
            top: -11px;
            width: 10px;
            height: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,154,63,0.5));
            border-radius: 50% 50% 60% 60%;
            transform: translateX(-50%) rotate(12deg);
            filter: blur(1px);
            animation: ember 0.7s ease-in-out infinite alternate;
            opacity: 0.85;
        }
        .matchstick:hover {
            transform: scale(1.1);
        }
        .matchstick.removed {
            opacity: 0;
            transform: translateY(20px) rotate(45deg);
        }
        .computer-move-animation {
            animation: move-out 0.5s ease-in-out forwards;
        }
        @keyframes flame {
            0% {
                transform: translateX(-50%) scale(0.85) rotate(-10deg);
                opacity: 0.75;
            }
            100% {
                transform: translateX(-50%) scale(1.2) rotate(12deg);
                opacity: 1;
            }
        }
        @keyframes ember {
            0% {
                transform: translateX(-50%) rotate(-8deg) scaleY(0.8);
                opacity: 0.6;
            }
            100% {
                transform: translateX(-50%) rotate(8deg) scaleY(1.2);
                opacity: 1;
            }
        }
        @keyframes burn {
            0% {
                transform: rotate(-1deg) translateY(0);
            }
            100% {
                transform: rotate(1deg) translateY(1px);
            }
        }
        @keyframes move-out {
            0% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }
            100% {
                transform: translateY(50px) rotate(45deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg text-center">
        <h1 class="text-3xl sm:text-4xl font-bold text-yellow-500 mb-4">Matchstick Game</h1>
        <p class="text-lg mb-6 text-gray-400">The player who picks the last matchstick loses.</p>
        
        <div id="game-container" class="space-y-6">
            <div id="matchstick-container" class="flex flex-wrap justify-center gap-2 mb-6 transition-all duration-500"></div>
            
            <p id="message" class="text-xl font-semibold h-8"></p>
            
            <div id="controls" class="space-y-4">
                <p class="text-gray-300">Your turn. Pick how many matchsticks:</p>
                <div class="flex justify-center space-x-4">
                    <button onclick="takeSticks(1)" class="bg-pink-500 text-white font-bold py-2 px-4 rounded-full hover:bg-pink-600 transition duration-300 transform hover:scale-105">1</button>
                    <button onclick="takeSticks(2)" class="bg-pink-500 text-white font-bold py-2 px-4 rounded-full hover:bg-pink-600 transition duration-300 transform hover:scale-105">2</button>
                    <button onclick="takeSticks(3)" class="bg-pink-500 text-white font-bold py-2 px-4 rounded-full hover:bg-pink-600 transition duration-300 transform hover:scale-105">3</button>
                    <button onclick="takeSticks(4)" class="bg-pink-500 text-white font-bold py-2 px-4 rounded-full hover:bg-pink-600 transition duration-300 transform hover:scale-105">4</button>
                </div>
            </div>
            
            <button onclick="resetGame()" class="bg-gray-600 text-white font-bold py-2 px-6 rounded-full hover:bg-gray-700 transition duration-300 transform hover:scale-105">Reset Game</button>
        </div>
    </div>

    <script>
    let totalSticks = 21;

    const container = document.getElementById('matchstick-container');
    const message = document.getElementById('message');
    const controls = document.getElementById('controls');

    function renderMatchsticks() {
        container.innerHTML = "";

        for (let i = 0; i < totalSticks; i++) {
            const stick = document.createElement("div");
            stick.className = "matchstick";
            container.appendChild(stick);
        }
    }

    async function takeSticks(num) {
        if (
            controls.classList.contains("pointer-events-none") ||
            totalSticks <= 1 ||
            num > totalSticks - 1
        ) {
            return;
        }

        // Player move
        totalSticks -= num;
        renderMatchsticks();
        message.textContent = `You took ${num} matchstick${num > 1 ? "s" : ""}.`;

        if (totalSticks === 1) {
            setTimeout(() => {
                displayResult("🎉 You Win!");
            }, 500);
            return;
        }

        controls.classList.add("pointer-events-none");
        message.textContent = "Computer is thinking...";

        await new Promise(resolve => setTimeout(resolve, 1000));

        // Computer move (always makes total taken = 5)
        let computerMove = 5 - num;

        if (computerMove > totalSticks - 1) {
            computerMove = totalSticks - 1;
        }

        totalSticks -= computerMove;
        renderMatchsticks();

        message.textContent = `Computer took ${computerMove} matchstick${computerMove > 1 ? "s" : ""}.`;

        if (totalSticks === 1) {
            setTimeout(() => {
                displayResult("😞 You Lose! Computer Wins.");
            }, 500);
            return;
        }

        controls.classList.remove("pointer-events-none");
    }

    function displayResult(resultMessage) {
        message.textContent = resultMessage;
        controls.classList.add("hidden");
    }

    function resetGame() {
        totalSticks = 21;
        controls.classList.remove("hidden", "pointer-events-none");
        message.textContent = "Your turn. Pick 1–4 matchsticks.";
        renderMatchsticks();
    }

    window.onload = resetGame;
</script>
</body>
</html>
